http {
    # Веб-приложение
    limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;

    # Мобильное приложение
    limit_req_zone $binary_remote_addr zone=mobile:10m rate=30r/s;

    upstream logistics_backend {
        server logistics.company.com max_fails=5 fail_timeout=30s;
    }

    server {
        listen 8080;

        location /api/web/ {
            limit_req zone=web burst=100;
            proxy_pass http://backend;
        }

        location /api/mobile/ {
            limit_req zone=mobile burst=60;
            proxy_pass http://backend;
        }

        # Circuit Breaker
        location /logistics/ {
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;

            proxy_pass http://logistics_backend;

            error_page 502 503 504 = @fallback;
        }

        location @fallback {
            return 503 '{"code": "delivery_unavailable", "message": "Сервис доставки временно недоступен"}';
        }
    }
}